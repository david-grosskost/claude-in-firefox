<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 260px; color: #222; background: #fff; }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; display: inline-block; }
    .on .dot { background: #2e7d32; }
    p { margin: 6px 0 0; color: #555; line-height: 1.4; }
    code { font-size: 12px; }
    @media (prefers-color-scheme: dark) { body { background: #2b2a33; color: #eee; } p { color: #bbb; } }
  </style>
</head>
<body>
  <h1><img src="icon.svg" width="18" height="18" alt=""> Claude in Firefox</h1>
  <div id="status"><span class="dot"></span> <span id="label">…</span></div>
  <p id="hint"></p>
  <script src="popup.js"></script>
</body>
</html>
